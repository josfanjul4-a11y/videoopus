    const y = new Float32Array(x.length);
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (let i = 0; i < x.length; i++) {
      const v = b[0] * x[i] + b[1] * x1 + b[2] * x2 - a[1] * y1 - a[2] * y2;
      x2 = x1;
      x1 = x[i];
      y2 = y1;
      y1 = v;
      y[i] = v;
    }
    return y;
  }
  function loudness(chans, sr = 48e3) {
    const kw = chans.map((c) => biquad(biquad(c, K48.shelf), K48.hp));
    const block = Math.round(0.4 * sr), step = Math.round(0.1 * sr);
    const ms = [];
    for (let s = 0; s + block <= kw[0].length; s += step) {
      let z = 0;
      for (const c of kw) {
        let acc = 0;
        for (let i = s; i < s + block; i++) acc += c[i] * c[i];
        z += acc / block;
      }
      ms.push(z);
    }
    const L = (z) => -0.691 + 10 * Math.log10(Math.max(z, 1e-12));
    const abs = ms.filter((z) => L(z) > -70);
    const meanAbs = abs.reduce((a, b) => a + b, 0) / Math.max(1, abs.length);
    const rel = L(meanAbs) - 10;
    const gated = abs.filter((z) => L(z) > rel);
    const integrated = L(gated.reduce((a, b) => a + b, 0) / Math.max(1, gated.length));
    const momentary = Float32Array.from(ms.map(L));
    const st = [];
    const n3 = 30;
    for (let k = 0; k + n3 <= ms.length; k++) {
      let z = 0;
      for (let j = k; j < k + n3; j++) z += ms[j];
      st.push(L(z / n3));
    }
    return { integrated, momentary, shortTerm: Float32Array.from(st) };
  }
  var TAPS = (() => {
    const out = [];
    for (let ph = 1; ph < 4; ph++) {
      const f = ph / 4, t = [];
      let s = 0;
      for (let k = -3; k <= 4; k++) {
        const x = k - f;
        const sinc = x === 0 ? 1 : Math.sin(Math.PI * x) / (Math.PI * x);
        const w = 0.5 + 0.5 * Math.cos(Math.PI * x / 4.5);
        t.push(sinc * w);
        s += sinc * w;
      }
      out.push(t.map((v) => v / s));
    }
    return out;
  })();
  function truePeak(chans) {
    let peak = 0;
    for (const c of chans) {
      for (let i = 3; i < c.length - 4; i++) {
        const a = Math.abs(c[i]);
        if (a > peak) peak = a;
        if (a < peak * 0.5) continue;
        for (const t of TAPS) {
          let v = 0;
          for (let k = 0; k < 8; k++) v += t[k] * c[i - 3 + k];
          if (Math.abs(v) > peak) peak = Math.abs(v);
        }
      }
    }
    return peak;
  }
  function limit(chans, sr, ceiling) {
    const n = chans[0].length;
    const need = new Float32Array(n).fill(1);
    const guard = ceiling * 0.6;
    for (let i = 3; i < n - 4; i++) {
      let p = 0, near = 0;
      for (const c of chans) {
        const a = Math.abs(c[i]);
        if (a > p) p = a;
        const b = Math.max(Math.abs(c[i - 1]), Math.abs(c[i + 1]), Math.abs(c[i + 2]));
        if (b > near) near = b;
      }
      if (Math.max(p, near) > guard) {
        for (const c of chans) {
          for (const t of TAPS) {
            let v = 0;
            for (let k = 0; k < 8; k++) v += t[k] * c[i - 3 + k];
            if (Math.abs(v) > p) p = Math.abs(v);
          }
        }
      }
      if (p > ceiling) need[i] = ceiling / p;
    }
    const look = Math.round(5e-3 * sr);
    const g = new Float32Array(n);
    const dq = new Int32Array(n);
    let head = 0, tail = 0;
    for (let j = 0; j < n + look; j++) {
      if (j < n) {
        while (tail > head && need[dq[tail - 1]] >= need[j]) tail--;
        dq[tail++] = j;
      }
      const i = j - look;
      if (i >= 0) {
        while (dq[head] < i) head++;
        g[i] = need[dq[head]];
      }
    }
    const avg = new Float32Array(n);
    let sum = 0;
    for (let i = 0; i < n; i++) {
      sum += g[i];
      if (i > look) sum -= g[i - look - 1];
      avg[i] = sum / Math.min(i + 1, look + 1);
    }
    const rel = Math.exp(-1 / (0.12 * sr));
    let cur = 1;
    for (let i = 0; i < n; i++) {
      const target = avg[i];
      cur = target < cur ? target : target + (cur - target) * rel;
      g[i] = cur;
    }
    for (const c of chans) for (let i = 0; i < n; i++) c[i] *= g[i];
  }
  function master(chans, sr, { target = -14, ceilingDb = -1.2, fadeIn = 0.05, fadeOutEnd = null, fadeOut = 1.5 } = {}) {
    const before = loudness(chans, sr).integrated;
    const gain = Math.pow(10, (target - before) / 20);
    for (const c of chans) for (let i = 0; i < c.length; i++) c[i] *= gain;
    const ceiling = Math.pow(10, ceilingDb / 20);
    limit(chans, sr, ceiling);
    const mid = loudness(chans, sr).integrated;
    const g2 = Math.pow(10, (target - mid) / 20);
    if (Math.abs(target - mid) > 0.05) {
      for (const c of chans) for (let i = 0; i < c.length; i++) c[i] *= g2;
      limit(chans, sr, ceiling);
    }
    const n = chans[0].length;
    const fi = Math.round(fadeIn * sr);
    const end = fadeOutEnd != null ? Math.min(n, Math.round(fadeOutEnd * sr)) : n;
    const fo = Math.round(fadeOut * sr);
    for (const c of chans) {
      for (let i = 0; i < fi; i++) c[i] *= i / fi;
      for (let i = Math.max(0, end - fo); i < n; i++) {
        const x = i >= end ? 0 : (end - i) / fo;
        c[i] *= x * x * (3 - 2 * x);
      }
    }
    const after = loudness(chans, sr);
    return { before, gain: gain * g2, integrated: after.integrated, truePeak: truePeak(chans), loud: after };
  }

  // src/audio/engine.js
  async function renderScore(score, { duration, sr = 48e3, onProgress = null, withStems = false } = {}) {
    const len = Math.ceil(duration * sr);
    const ctx = new OfflineAudioContext(4, len, sr);
    const sh = makeShared(ctx);
    const musicDry = ctx.createGain(), musicRev = ctx.createGain(), sfxDry = ctx.createGain(), sfxRev = ctx.createGain();
    const conv1 = ctx.createConvolver();
    conv1.normalize = true;
    conv1.buffer = makeIR(ctx, 4.2, 7);
    const conv2 = ctx.createConvolver();
    conv2.normalize = true;
    conv2.buffer = makeIR(ctx, 2.6, 9);
    const musicSum = ctx.createGain(), sfxSum = ctx.createGain();
    musicDry.connect(musicSum);
    musicRev.connect(conv1).connect(musicSum);
    sfxDry.connect(sfxSum);
    sfxRev.connect(conv2).connect(sfxSum);
    const merger = ctx.createChannelMerger(4);
    const s1 = ctx.createChannelSplitter(2), s2 = ctx.createChannelSplitter(2);
    musicSum.connect(s1);
    sfxSum.connect(s2);
    s1.connect(merger, 0, 0);
    s1.connect(merger, 1, 1);
    s2.connect(merger, 0, 2);
    s2.connect(merger, 1, 3);
    merger.connect(ctx.destination);
    const bus = (dry, rev, dryGain, sendGain) => {
      const g = ctx.createGain();
      const d = ctx.createGain();
      d.gain.value = dryGain;
      const s = ctx.createGain();
      s.gain.value = sendGain;
      g.connect(d).connect(dry);
      g.connect(s).connect(rev);
      return g;
    };
    const B = {
      piano: bus(musicDry, musicRev, 0.85, 0.32),
      celesta: bus(musicDry, musicRev, 0.7, 0.5),
      strings: bus(musicDry, musicRev, 0.75, 0.45),
      cello: bus(musicDry, musicRev, 0.8, 0.35),
      choir: bus(musicDry, musicRev, 0.55, 0.7),
      bells: bus(musicDry, musicRev, 0.6, 0.6),
      low: bus(musicDry, musicRev, 0.9, 0.2),
      heart: bus(sfxDry, sfxRev, 0.95, 0.12),
      sfx: bus(sfxDry, sfxRev, 0.7, 0.45),
      air: bus(sfxDry, sfxRev, 0.6, 0.5)
    };
    const events = score.events.slice().sort((a, b) => a.t - b.t);
    let k = 0;
    const schedule = (until) => {
      while (k < events.length && events[k].t < until) {
        events[k].fn(ctx, sh, B);
        k++;
      }
    };
    const CH = 2, AHEAD = 0.6;
    schedule(CH + AHEAD);
    for (let t = CH; t < duration; t += CH) {
      const tt = t;
      ctx.suspend(tt).then(() => {
        schedule(tt + CH + AHEAD);
        if (onProgress) onProgress(tt / duration);
        ctx.resume();
      });
    }
    const buf = await ctx.startRendering();
    const m = [buf.getChannelData(0), buf.getChannelData(1)];
    const x = [buf.getChannelData(2), buf.getChannelData(3)];
    const L = new Float32Array(len), R = new Float32Array(len);
    for (let i = 0; i < len; i++) {
      L[i] = m[0][i] + x[0][i];
      R[i] = m[1][i] + x[1][i];
    }
    const stems = withStems ? { music: [Float32Array.from(m[0]), Float32Array.from(m[1])], sfx: [Float32Array.from(x[0]), Float32Array.from(x[1])] } : null;
    const report = master([L, R], sr, { target: score.target ?? -14, ceilingDb: -1.2, fadeOutEnd: score.fadeOutEnd ?? duration, fadeOut: score.fadeOut ?? 1.5 });
    if (stems) {
      for (const st of [stems.music, stems.sfx]) for (const c of st) for (let i = 0; i < c.length; i++) c[i] *= report.gain;
    }
    return { L, R, sr, report, stems };
  }

  // src/audio/theme.js
  var PHRASE_A = [[70, 1], [79, 1.5], [77, 0.5], [75, 1], [74, 1], [75, 1], [77, 1.5], [79, 0.5], [77, 1], [70, 3]];
  var PHRASE_B = [[70, 1], [72, 1], [74, 1], [75, 1.5], [80, 0.5], [79, 1], [77, 1], [75, 1], [74, 1], [75, 3]];
  var HARM_A = [
    [51, 58, 63, 67],
    // E♭
    [56, 60, 63, 67],
    // A♭maj7
    [53, 56, 60, 63],
    // Fm7
    [46, 58, 62, 65]
    // B♭
  ];
  var HARM_B = [
    [51, 58, 63, 67],
    // E♭
    [56, 60, 63, 67],
    // A♭
    [46, 56, 62, 65],
    // B♭7
    [51, 58, 63, 67]
    // E♭
  ];
  function placePhrase(phrase, t0, bpm, transpose = 0) {
    const spb = 60 / bpm;
    const out = [];
    let b = 0;
    for (const [m, beats] of phrase) {
      out.push({ t: t0 + b * spb, midi: m + transpose, dur: beats * spb, beat: b });
      b += beats;
    }
    return out;
  }

  // src/audio/testscore.js
  function testScore() {
    const ev = [];
    const E2 = (t, fn) => ev.push({ t, fn });
    E2(0.5, (c, sh, B) => bell(c, sh, B.bells, 0.5, 82, 0.5, 0.1, 1.2));
    E2(0.3, (c, sh, B) => drone(c, sh, B.low, 0.3, 39, 0.25, 22, 3, 3));
    E2(1, (c, sh, B) => whistle(c, sh, B.sfx, 1, 2.2, 700, 1400, 0.4, -0.2));
    const bpm = 72, t0 = 3, spb = 60 / bpm;
    [...placePhrase(PHRASE_A, t0, bpm), ...placePhrase(PHRASE_B, t0 + 12 * spb, bpm)].forEach((n) => E2(n.t, (c, sh, B) => celesta(c, sh, B.celesta, n.t, n.midi + 12, 0.55, 0.15)));
    [...HARM_A, ...HARM_B].forEach((ch, bar) => {
      const t = t0 + bar * 3 * spb;
      ch.forEach((m, i) => E2(t, (c, sh, B) => strings(c, sh, B.strings, t, m, 0.3, 3 * spb, (i - 1.5) * 0.3, 0.5, 1)));
    });
    for (let t = t0; t < t0 + 24 * spb; t += 60 / 144) E2(t, (c, sh, B) => heartbeat(c, sh, B.heart, t, 0.5, "fetal"));
    const td = 25;
    placePhrase(PHRASE_B, td, 56).slice(0, 9).forEach((n) => E2(n.t, (c, sh, B) => piano(c, sh, B.piano, n.t, n.midi, 0.55, n.dur * 1.2, 0.1)));
    [[51, 58, 63], [56, 60, 63], [46, 56, 62]].forEach((ch, bar) => ch.forEach((m) => E2(td + bar * 3 * 60 / 56, (c, sh, B) => piano(c, sh, B.piano, td + bar * 3 * 60 / 56, m - 12, 0.35, 3, -0.2))));
    let hb = td, gap = 60 / 56;
    while (hb < td + 9) {
      const t = hb;
      E2(t, (c, sh, B) => heartbeat(c, sh, B.heart, t, 0.8));
      gap *= 1.08;
      hb += gap;
    }
    E2(hb, (c, sh, B) => heartbeat(c, sh, B.heart, hb, 0.6, "half"));
    const ts = hb + 2.5;
    E2(ts, (c, sh, B) => grains(c, sh, B.sfx, ts, 4, 30, 0.6, [75, 77, 79, 82, 84]));
    E2(ts, (c, sh, B) => choir(c, sh, B.choir, ts, 63, 0.3, 6, 0, 0.2));
    E2(ts, (c, sh, B) => choir(c, sh, B.choir, ts, 70, 0.3, 6, 0.2, 0.2));
    const merges = [ts + 4, ts + 5.6, ts + 6.8, ts + 7.8, ts + 8.6, ts + 9.2];
    [70, 72, 74, 75, 80, 79].forEach((m, i) => E2(merges[i], (c, sh, B) => bell(c, sh, B.bells, merges[i], m, 0.5 + i * 0.07, (i - 2.5) * 0.2)));
    const tc = merges[5] + 0.6;
    [[77, 0], [75, 0.35], [74, 0.7], [75, 1.05]].forEach(([m, dt]) => {
      const t = tc + dt;
      E2(t, (c, sh, B) => piano(c, sh, B.piano, t, m, 0.75, dt > 1 ? 4 : 0.4, 0));
      E2(t, (c, sh, B) => strings(c, sh, B.strings, t, m, 0.5, dt > 1 ? 5 : 0.4, 0.1, 0.08, 1.5));
    });
    const tr = tc + 1.05;
    [51, 58, 63, 67, 70, 75].forEach((m, i) => {
      E2(tr, (c, sh, B) => strings(c, sh, B.strings, tr, m, 0.55, 5, (i - 2.5) * 0.25, 0.2, 2));
      E2(tr, (c, sh, B) => choir(c, sh, B.choir, tr, m + 12, 0.35, 5, (i - 2.5) * 0.2, 0.8));
    });
    E2(tr, (c, sh, B) => bell(c, sh, B.bells, tr, 75, 0.8, 0, 1.5));
    E2(tr, (c, sh, B) => drone(c, sh, B.low, tr, 39, 0.5, 5, 0.1, 2));
    return { events: ev, duration: tr + 8, fadeOutEnd: tr + 8, fadeOut: 2.5 };
  }

  // src/main.js
  var params = new URLSearchParams(location.search);
  var OPT = {
    t: parseFloat(params.get("t") ?? "0") || 0,
    freeze: params.has("freeze"),
    debug: params.has("debug"),
    bench: params.has("bench"),
    w: parseInt(params.get("w") ?? "0", 10),
    h: parseInt(params.get("h") ?? "0", 10),
    spike: params.get("spike"),
    scale: parseFloat(params.get("scale") ?? "1") || 1
  };
  function sizeCanvas(canvas) {
    let w, h;
    if (OPT.w && OPT.h) {
      w = OPT.w;
      h = OPT.h;
    } else {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vw = window.innerWidth, vh = window.innerHeight;
      const cw = Math.min(vw, vh * 16 / 9), ch = cw * 9 / 16;
      canvas.style.width = cw + "px";
      canvas.style.height = ch + "px";
      w = Math.min(1920, Math.round(cw * dpr));
      h = Math.round(w * 9 / 16);
    }
    canvas.width = w;
    canvas.height = h;
  }
  window.__renderAudio = async (name = "test") => {
    const score = name === "test" ? testScore() : null;
    const t0 = performance.now();
    const res = await renderScore(score, { duration: score.duration, withStems: true });
    const ms = performance.now() - t0;
    window.__audio = { L: res.L, R: res.R, mL: res.stems.music[0], mR: res.stems.music[1], xL: res.stems.sfx[0], xR: res.stems.sfx[1] };
    const r = res.report;
    return { sr: res.sr, length: res.L.length, renderMs: ms, before: r.before, gain: r.gain, integrated: r.integrated, truePeak: r.truePeak };
  };
  window.__audioChunk = (key, start, len) => {
    const a = window.__audio[key].subarray(start, start + len);
    const u8 = new Uint8Array(a.buffer, a.byteOffset, a.byteLength);
    let s = "";
    for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
    return btoa(s);
  };
  async function boot() {
    if (params.has("audio")) {
      window.__ready = true;
      return;
    }
    const canvas = document.getElementById("c");
    sizeCanvas(canvas);
    const engine = createEngine(canvas);
    const scene = OPT.spike ? spikes[OPT.spike](engine) : null;
    if (!scene) throw new Error("film not built yet");
    window.__renderAt = (t, scale = OPT.scale) => {
      engine.render(scene, t, scale);
      return canvas.toDataURL("image/png");
    };
    window.__ready = true;
    if (OPT.freeze) {
      engine.render(scene, OPT.t, OPT.scale);
      return;
    }
    const t0 = performance.now();
    const loop = () => {
      const t = OPT.t + (performance.now() - t0) / 1e3;
      engine.render(scene, t, OPT.scale);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  boot().catch((e) => {
    console.error(e);
    window.__error = String(e && e.stack ? e.stack : e);
  });
})();
